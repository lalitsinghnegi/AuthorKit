<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Acme Health | Home</title>
    <link rel="stylesheet" href="/etc.clientlibs/acme/clientlibs/clientlib-site.css" />
    <script src="/etc.clientlibs/acme/clientlibs/clientlib-site.js"></script>
  </head>
  <body class="page basicpage">
    <div class="root container responsivegrid">
      <div class="cmp-container">
        <header class="experiencefragment">
          <div
            id="experiencefragment-header"
            class="cmp-experiencefragment cmp-experiencefragment--header"
          >
            <div class="cmp-container">
              <div class="image">
                <div class="cmp-image" data-cmp-is="image">
                  <a class="cmp-image__link" href="/en.html"
                    ><img
                      class="cmp-image__image"
                      src="/content/dam/acme/logo.svg"
                      alt="Acme Health"
                  /></a>
                </div>
              </div>
              <div class="navigation">
                <nav class="cmp-navigation" role="navigation" aria-label="Main">
                  <ul class="cmp-navigation__group">
                    <li
                      class="cmp-navigation__item cmp-navigation__item--level-0 cmp-navigation__item--active"
                    >
                      <a class="cmp-navigation__item-link" href="/en/about.html">About</a>
                    </li>
                    <li class="cmp-navigation__item cmp-navigation__item--level-0">
                      <a class="cmp-navigation__item-link" href="/en/treatment.html">Treatment</a>
                    </li>
                    <li class="cmp-navigation__item cmp-navigation__item--level-0">
                      <a class="cmp-navigation__item-link" href="/en/faq.html">FAQ</a>
                    </li>
                  </ul>
                </nav>
              </div>
            </div>
          </div>
        </header>

        <main class="container responsivegrid">
          <div class="cmp-container">
            <div class="title">
              <div class="cmp-title"><h1 class="cmp-title__text">Living well with Acme</h1></div>
            </div>
            <div class="text">
              <div class="cmp-text">
                <p>Talk to your doctor about Acme.<sup>1</sup></p>
              </div>
            </div>
            <div class="button cta-primary">
              <a class="cmp-button cmp-button--primary" href="/en/signup.html">
                <span class="cmp-button__icon cmp-button__icon--arrow" aria-hidden="true"></span>
                <span class="cmp-button__text">Sign up</span>
              </a>
            </div>
            <div class="button">
              <a class="cmp-button cmp-button--secondary" href="/en/learn.html"
                ><span class="cmp-button__text">Learn more</span></a
              >
            </div>
            <div class="accordion panelcontainer">
              <div id="accordion-1" class="cmp-accordion" data-cmp-is="accordion">
                <div
                  class="cmp-accordion__item"
                  data-cmp-hook-accordion="item"
                  id="accordion-1-item-1"
                >
                  <h3 class="cmp-accordion__header">
                    <button
                      id="accordion-1-item-1-button"
                      class="cmp-accordion__button cmp-accordion__button--expanded"
                      type="button"
                      aria-controls="accordion-1-item-1-panel"
                      aria-expanded="true"
                      data-cmp-hook-accordion="button"
                    >
                      <span class="cmp-accordion__title">How is Acme taken?</span>
                      <span class="cmp-accordion__icon"></span>
                    </button>
                  </h3>
                  <div
                    id="accordion-1-item-1-panel"
                    class="cmp-accordion__panel cmp-accordion__panel--expanded"
                    role="region"
                    aria-labelledby="accordion-1-item-1-button"
                    data-cmp-hook-accordion="panel"
                  >
                    <div class="text">
                      <div class="cmp-text"><p>Once a day, with food.</p></div>
                    </div>
                  </div>
                </div>
                <div
                  class="cmp-accordion__item"
                  data-cmp-hook-accordion="item"
                  id="accordion-1-item-2"
                >
                  <h3 class="cmp-accordion__header">
                    <button
                      id="accordion-1-item-2-button"
                      class="cmp-accordion__button"
                      type="button"
                      aria-controls="accordion-1-item-2-panel"
                      aria-expanded="false"
                      data-cmp-hook-accordion="button"
                    >
                      <span class="cmp-accordion__title">What are the side effects?</span>
                      <span class="cmp-accordion__icon"></span>
                    </button>
                  </h3>
                  <div
                    id="accordion-1-item-2-panel"
                    class="cmp-accordion__panel cmp-accordion__panel--hidden"
                    role="region"
                    aria-labelledby="accordion-1-item-2-button"
                    data-cmp-hook-accordion="panel"
                  >
                    <div class="text">
                      <div class="cmp-text"><p>See the Important Safety Information.</p></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>

        <footer class="experiencefragment">
          <div
            id="experiencefragment-footer"
            class="cmp-experiencefragment cmp-experiencefragment--footer"
          >
            <div class="cmp-container footer__inner">
              <div class="image">
                <div class="cmp-image">
                  <img
                    class="cmp-image__image"
                    src="/content/dam/acme/logo-white.svg"
                    alt="Acme Health"
                  />
                </div>
              </div>
              <ul class="footer-links">
                <li><a class="footer-link" href="/en/privacy.html">Privacy</a></li>
                <li><a class="footer-link" href="/en/terms.html">Terms of use</a></li>
              </ul>
              <div class="text footer-legal">
                <div class="cmp-text"><p>This site is intended for US residents only.</p></div>
              </div>
              <p class="footer-copyright">© 2026 Acme Health. All rights reserved.</p>
            </div>
          </div>
        </footer>
      </div>
    </div>
  </body>
</html>
